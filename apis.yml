aid: eureka-therapeutics
name: Eureka Therapeutics
description: 'Eureka Therapeutics, Inc. is a privately held, clinical-stage biopharmaceutical
  company headquartered in Emeryville, California, developing T-cell therapies for solid
  tumors and hematologic malignancies. The company was founded by Dr. Cheng Liu and is
  built on two proprietary platforms: E-ALPHA, a high-throughput human antibody discovery
  engine used to find binders against cancer-specific targets, and ARTEMIS, an engineered
  T-cell receptor platform (AbTCR) designed to deliver CAR-T-level potency with a reduced
  cytokine-release profile. Its clinical programs include ET140203 (ARYA-1 in adults,
  ARYA-2 in pediatrics) and ECT204 (ARYA-3) in advanced liver cancer, alongside a GPC2
  ARTEMIS T-cell program for neuroblastoma licensed from the National Cancer Institute.
  Eureka publishes a corporate website, pipeline and technology overviews, a press-release
  archive with an RSS feed, and patient-facing trial information; as of this profile it
  publishes no public developer portal, API documentation, or machine-readable API contract.'
